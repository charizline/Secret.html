<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eto sayo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* BLACK + PINK GRADIENT */
            background: linear-gradient(135deg, #0d0d0d 0%, #1a0510 40%, #b3005e 100%);
            padding: 20px;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 40px 45px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 2px #ff3b8a inset;
            max-width: 600px;
            width: 100%;
            text-align: center;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: scale(1.01);
        }

        /* === MESSAGE === */
        .message {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ff4d9e;
            text-shadow: 0 0 20px #ff1a7a, 0 0 60px #b3005e;
            letter-spacing: 1px;
            margin-bottom: 35px;
            word-break: break-word;
        }

        /* === IMAGE (MEDIUM) === */
        .image-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 3px #ff3b8a;
            transition: 0.3s ease;
            background: #1a1a1a;
        }

        .image-wrapper img:hover {
            transform: scale(1.04);
            box-shadow: 0 25px 50px rgba(255, 30, 120, 0.5);
        }

        /* === RESPONSIVE === */
        @media (max-width: 480px) {
            .card {
                padding: 30px 18px;
            }
            .message {
                font-size: 1.6rem;
            }
            .image-wrapper img {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- MESSAGE -->
        <div class="message">👀 Ano tinitingin mo? Eto sayo.</div>

        <!-- IMAGE (PALITAN ANG src) -->
        <div class="image-wrapper">
            <img src="https://via.placeholder.com/300x300/1a1a1a/ff4d9e?text=PHOTO" alt="Your photo" />
        </div>
    </div>

</body>
</html>
